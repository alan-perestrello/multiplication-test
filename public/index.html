<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Times Table Test</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#1b2a4e;--mute:#5d6b8c;--line:#d5dff3;--accent:#2f5bea;--on-accent:#fff;--good:#13795b;--good-bg:#dcf5ea;--bad:#b3261e;--bad-bg:#fde4e2;--warn:#b45309;--edge:#7587b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1730;--card:#18234a;--ink:#eef2ff;--mute:#a6b3d8;--line:#2d3b6b;--accent:#7e9bff;--on-accent:#0f1730;--good:#6fe0b3;--good-bg:#12352b;--bad:#ff9a92;--bad-bg:#40201f;--warn:#ffc83d;--edge:#7283b8}}
:root[data-theme="dark"]{--bg:#0f1730;--card:#18234a;--ink:#eef2ff;--mute:#a6b3d8;--line:#2d3b6b;--accent:#7e9bff;--on-accent:#0f1730;--good:#6fe0b3;--good-bg:#12352b;--bad:#ff9a92;--bad-bg:#40201f;--warn:#ffc83d;--edge:#7283b8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px}
main{width:100%;max-width:520px}
h1{font-size:2rem;margin:8px 0 4px;font-weight:600}
p.sub{margin:0 0 20px;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
label{font-weight:500}
.hint{display:block;color:var(--mute);font-size:.85rem;font-weight:400}
input[type=number]{width:96px;font:inherit;font-size:1.2rem;text-align:center;padding:10px;border:2px solid var(--edge);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;font-size:1.2rem;border:0;border-radius:14px;padding:14px 22px;background:var(--accent);color:var(--on-accent);cursor:pointer;width:100%}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--edge);margin-top:10px}
.err{color:var(--bad);min-height:1.3em;margin:0 0 10px;font-size:.95rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;margin-bottom:10px}.linkbtn{width:auto;background:none;color:var(--mute);font-size:.95rem;font-weight:500;padding:10px 8px;text-decoration:underline;border-radius:8px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .25s linear}
.bar i.low{background:var(--bad)}
.q{font-size:clamp(3rem,16vw,4.6rem);font-weight:600;text-align:center;margin:10px 0 18px;letter-spacing:.02em}
.ans{text-align:center;display:block;width:100%!important;font-size:2.4rem!important;margin-bottom:14px}
.fb{min-height:2em;font-size:1.3rem;text-align:center;font-weight:600;margin:0 0 12px}
.ans.ok{border-color:var(--good);background:var(--good-bg);animation:pop .25s ease-out}.ans.no{border-color:var(--bad);background:var(--bad-bg)}@keyframes pop{50%{transform:scale(1.03)}}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.score{font-size:4rem;font-weight:600;text-align:center;margin:0}
.msg{text-align:center;color:var(--mute);margin:0 0 18px}
.stats{display:flex;gap:10px;margin-bottom:18px}
.stats div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:10px}
.stats b{display:block;font-size:1.4rem}
#report h2,#rcBody h2{font-size:1.15rem;margin:22px 0 6px}.note{color:var(--mute);margin:0 0 10px;font-size:.92rem}.chart{overflow-x:auto;padding-bottom:6px}.plot{position:relative;height:150px;display:flex;align-items:flex-end;gap:3px;border-bottom:2px solid var(--line)}.plot .col{flex:1 0 12px;height:100%;display:flex;align-items:flex-end}.plot .col i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:3px}.plot .ok{background:var(--good)}.plot .no{background:var(--bad)}.plot .na{background:var(--line)}.avg{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.6;pointer-events:none}.trow{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center;margin-bottom:12px}.track{height:14px;background:var(--line);border-radius:8px;overflow:hidden}.track i{display:block;height:100%}.tinfo{grid-column:2;font-size:.85rem;color:var(--mute)}.logbox{max-height:320px;overflow:auto;margin-bottom:18px}table.log{width:100%;border-collapse:collapse;font-size:.95rem}table.log th,table.log td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}table.log tr.w td{background:var(--bad-bg);color:var(--bad)}
.plot.v .col{flex:1 0 28px;flex-direction:column;justify-content:flex-end;align-items:stretch}.plot .ac{background:var(--accent)}.val{font-size:.72rem;text-align:center;color:var(--mute);margin-bottom:2px}
select{font:inherit;font-size:1rem;padding:10px;border:2px solid var(--edge);border-radius:12px;background:var(--bg);color:var(--ink);max-width:180px}select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=email]{font:inherit;font-size:1.1rem;padding:10px;border:2px solid var(--edge);border-radius:12px;background:var(--bg);color:var(--ink);flex:1;min-width:0}#addBtn,#addBtn2{width:auto;padding:10px 18px;font-size:1rem}
.qline{display:flex;align-items:center;gap:10px;margin-bottom:12px}.qline .bar{flex:1;margin:0;height:8px}.qline .bar i{transition:none}.qline span{font-weight:600;min-width:2.6em;text-align:right;order:2}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}tr.click:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
#report .focus h2,#rcBody .focus h2,.focus h2{font-size:1.15rem;margin:0 0 6px}.focus{margin:0 0 18px;padding-top:14px;border-top:2px solid var(--line)}.trow.f{grid-template-columns:44px 1fr 44px}.trow .tinfo{grid-column:2}button.eye{color:var(--accent);border-color:var(--accent)!important;grid-column:3;grid-row:1/3;align-self:center;width:44px;height:44px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);border:2px solid var(--edge);border-radius:12px}button.eye:hover{background:var(--bg)}
.sync{margin-top:18px;padding:0 4px}.sync h2{font-size:1.05rem;margin:0 0 6px}.sync .note{margin:0 0 6px}.sync button{margin-top:8px;font-size:1rem}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px;user-select:none;-webkit-user-select:none}.pad button{height:68px;padding:0;font-size:1.7rem;touch-action:manipulation;background:var(--bg);color:var(--ink);border:2px solid var(--edge);border-radius:16px}.pad button:active{background:var(--line)}.pad button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px}button.preset{margin:0;padding:10px 4px;font-size:1rem;background:transparent;color:var(--ink);border:2px solid var(--edge)}button.preset small{display:block;font-weight:400;font-size:.78rem;color:var(--mute)}button.preset[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}button.preset[aria-pressed=true] small{color:var(--on-accent)}.sum{margin:0 0 12px}h1:focus{outline:none}
.ttgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin:0 0 10px}.tt{border-radius:12px;padding:8px 4px;text-align:center;border:2px solid var(--line);background:var(--bg)}.tt b{display:block;font-size:1.05rem}.tt span{font-size:.9rem}.tt.good{background:var(--good-bg);border-color:var(--good)}.tt.mid{border-color:var(--warn)}.tt.low{background:var(--bad-bg);border-color:var(--bad)}.trend{font-weight:600;margin:0 0 6px}.plot.v{justify-content:center}.plot.v .col{max-width:72px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.head h1{margin:8px 0 4px}.authbar{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.95rem}.authbar b{font-weight:600}.authbar button{width:auto;padding:8px 14px;font-size:1rem;margin:0}.authbar button.alt{margin:0}.authmsg{margin:0 0 12px}.sm{width:auto!important;padding:6px 12px!important;font-size:.9rem!important;margin:0!important}.who{display:flex;gap:10px;align-items:center;margin:0 0 12px}.chk{display:flex;gap:10px;align-items:center;padding:8px 0}.chk input{width:22px;height:22px}.rolechip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;border:2px solid var(--edge);margin-left:6px}
.tag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--accent);color:var(--on-accent)}
details.set{margin:0 0 14px;border:2px solid var(--line);border-radius:12px;padding:8px 12px}details.set summary{cursor:pointer;font-weight:600}details.set summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}dl.sl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 2px}dl.sl dt{color:var(--mute)}dl.sl dd{margin:0;font-weight:500}
.score .pc{font-size:1.8rem;color:var(--mute);white-space:nowrap}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.ans.ok{animation:none}}
</style>
</head>
<body>
<main>
<section id="setup">
 <div class="head"><h1>Times table test</h1><div class="authbar" id="authBar"></div></div>
 <p class="sub">Choose the settings, then press start.</p>
 <p class="note authmsg hidden" id="authMsg" role="alert"></p>
 <p class="note hidden" id="storeWarn" role="status"></p>
 <div class="card">
  <div class="row" id="nameRow"><label for="who">Name</label><select id="who"></select></div>
  <div class="row hidden" id="acctRow"><span>Taking the test as</span><b id="acctName"></b></div>
  <div class="row hidden" id="addRow"><input id="newName" type="text" maxlength="20" placeholder="Type a name" aria-label="New name"><button id="addBtn">Add</button></div>
  <div class="presets" role="group" aria-label="Quick start">
   <button type="button" class="preset" data-p="easy" aria-pressed="false">Easy<small>20 questions, 5 min</small></button>
   <button type="button" class="preset" data-p="hard" aria-pressed="false">Hard<small>25 questions, timed</small></button>
   <button type="button" class="preset" data-p="custom" aria-pressed="false">Custom<small>Choose your own</small></button>
  </div>
  <p class="note sum" id="presetSum"></p>
  <details class="set" id="more"><summary>More options</summary>
   <div class="row"><label for="n">Number of questions</label><input id="n" inputmode="numeric" type="number" min="1" max="100" value="20"></div>
   <div class="row"><label for="t">Time limit (minutes)<span class="hint">0 means no time limit</span></label><input id="t" inputmode="decimal" type="number" min="0" max="60" step="0.5" value="5"></div>
   <div class="row"><label for="lo">Tables from</label><input id="lo" inputmode="numeric" type="number" min="1" max="100" value="1"></div>
   <div class="row"><label for="hi">Tables up to</label><input id="hi" inputmode="numeric" type="number" min="1" max="100" value="10"></div>
   <div class="row"><label for="mn">Multiply by from<span class="hint">Set to 2 or more to skip the ×1 questions</span></label><input id="mn" inputmode="numeric" type="number" min="1" max="100" value="1"></div>
   <div class="row"><label for="mx">Multiply by up to<span class="hint">Usually 10 or 12</span></label><input id="mx" inputmode="numeric" type="number" min="1" max="100" value="10"></div>
   <div class="row"><label for="mode">Answer entry<span class="hint">Automatic submits once all the digits are typed</span></label><select id="mode"><option value="enter">Press Enter</option><option value="auto">Automatic</option></select></div>
   <div class="row"><label for="tmode">Timer mode<span class="hint">Moves on when the time for a question runs out</span></label><select id="tmode"><option value="off">Off</option><option value="on">On</option></select></div>
   <div class="row hidden" id="tsRow"><label for="tsec">Seconds per question</label><input id="tsec" inputmode="numeric" type="number" min="1" max="120" value="10"></div>
   <div class="row"><label for="padmode">Number pad<span class="hint">Automatic shows it on touch screens</span></label><select id="padmode"><option value="auto">Automatic</option><option value="on">Always</option><option value="off">Never</option></select></div>
  </details>
  <p class="err" id="err" role="alert"></p>
  <button id="start">Start test</button>
  <button class="alt" id="cardBtn">View report card</button>
 </div>
 <div class="sync" id="syncBox"></div>
 <input type="file" id="restoreFile" accept="application/json,.json" class="hidden">
</section>

<section id="quiz" class="hidden">
 <div class="top"><span id="prog"></span><button class="linkbtn" id="quit">Stop</button><span id="clock"></span></div>
 <div class="bar"><i id="fill"></i></div>
 <div class="card">
  <div class="qline hidden" id="qline"><span id="qtime"></span><div class="bar"><i id="qfill"></i></div></div>
  <div class="q" id="q"></div>
  <input class="ans" id="a" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" enterkeyhint="done" aria-label="Your answer">
  <p class="fb" id="fb" aria-live="polite"></p>
  <button id="go">Check answer</button>
  <div class="pad hidden" id="pad" role="group" aria-label="Number pad"></div>
 </div>
</section>

<section id="result" class="hidden">
 <h1 id="rh">Test finished</h1>
 <div class="card">
  <p class="score" id="score"></p>
  <p class="msg" id="msg"></p>
  <div class="stats"><div><b id="sc">0</b>correct</div><div><b id="sw">0</b>wrong</div><div><b id="st">0</b>time</div><div><b id="sq">0</b>per min</div></div>
  <p class="note" id="sv"></p>
  <div id="focusBox"></div>
  <div id="report"></div>
  <button id="again">Try again</button>
  <button class="alt" id="change">Change settings</button>
  <button class="alt" id="rc2">View report card</button>
 </div>
</section>
<section id="users" class="hidden">
 <h1>Users</h1>
 <div class="card">
  <p class="note">Only admins can see this screen. Each person signs in with their Google email.</p>
  <div class="logbox" id="userList"></div>
  <h2 id="uHead" style="font-size:1.15rem;margin:18px 0 8px">Add a user</h2>
  <div class="row"><label for="uEmail">Email</label><input id="uEmail" type="email" autocomplete="off" placeholder="name@gmail.com" style="max-width:230px"></div>
  <div class="row"><label for="uName">Name</label><input id="uName" type="text" maxlength="40" placeholder="Shown in reports" style="max-width:230px"></div>
  <div class="row"><label for="uRole">Role</label><select id="uRole"><option value="child">Child</option><option value="teacher">Teacher</option><option value="admin">Admin</option></select></div>
  <p class="err" id="uErr" role="alert"></p>
  <button id="uSave">Save user</button>
  <button class="alt" id="uBack">Back</button>
 </div>
</section>
<section id="rc" class="hidden">
 <h1>Report card</h1>
 <div class="card"><div class="row" id="who2Row"><label for="who2" id="who2lab">Name</label><select id="who2"></select></div>
  <div class="row hidden" id="addRow2"><input id="newName2" type="text" maxlength="20" placeholder="Type a name" aria-label="New name"><button id="addBtn2">Add</button></div>
  <div id="rcBody"></div>
  <button id="rcBack">Back</button>
  <button class="alt" id="rcClear">Clear results for this name</button></div>
</section>
</main>

<script>
(function(){
 var $=function(i){return document.getElementById(i)},PRAISE=["Correct!","Yes!","Nice one!","Spot on!"];
 var qs,idx,right,total,limit,startT,timer,locked,run=0,auto=false,tmode=false,perQ=10,baseQ=0,sched=null,focus=null,lastRec=null,padOn=false,acct=null,view=null,held='',cfg=null,log=[],qStart=0;

 function show(id){["setup","quiz","result","rc","users"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});if(id==="setup")renderSync();if(id!=="quiz"){var h=$(id).querySelector("h1");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}}
 function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
 function num(id){return parseFloat($(id).value)}

 function shuffle(a){for(var i=a.length-1,j,t;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
 function build(n,lo,hi,mn,mx){
  var pool=[],i,j;
  for(i=lo;i<=hi;i++)for(j=mn;j<=mx;j++)pool.push([i,j]);
  shuffle(pool);
  var out=[];
  while(out.length<n){out=out.concat(pool.slice(0,n-out.length));if(out.length<n)shuffle(pool)}
  return out.map(function(p){return Math.random()<.5?[p[0],p[1],p[0]]:[p[1],p[0],p[0]]});
 }

 function start(){
  var n=num("n"),t=num("t"),lo=num("lo"),hi=num("hi"),mx=num("mx"),mn=num("mn"),e="";
  if(!curName())e="Select a name or add one first.";
  else if(!(n>=1&&n<=100))e="Questions must be between 1 and 100.";
  else if(!(t===0||(t>=.5&&t<=60)))e="Time limit must be 0 (no limit) or between 0.5 and 60 minutes.";
  else if(!(lo>=1&&hi>=lo&&hi<=100))e="Tables must be between 1 and 100, and the first no higher than the last.";
  else if($("tmode").value==="on"&&!(num("tsec")>=1&&num("tsec")<=120))e="Seconds per question must be between 1 and 120.";
  else if(!(mn>=1&&mx>=mn&&mx<=100))e="Multiply by must be between 1 and 100, and the first no higher than the last.";
  $("err").textContent=e;
  if(e){$("more").open=true;if($("setup").classList.contains("hidden"))show("setup");return}
  begin({n:Math.floor(n),t:t,lo:Math.floor(lo),hi:Math.floor(hi),mn:Math.floor(mn),mx:Math.floor(mx),m:$("mode").value==="auto"?"auto":"enter",tq:$("tmode").value==="on"?num("tsec"):0},null);
 }

 function begin(c,fx){
  cfg=c;total=c.n;limit=c.t*60;auto=c.m==="auto";tmode=c.tq>0;baseQ=c.tq;focus=fx||null;view=null;sched=fx&&fx.k==="time"?fx:null;padOn=usePad();$("a").setAttribute("inputmode",padOn?"none":"numeric");$("pad").classList.toggle("hidden",!padOn);
  qs=build(total,c.lo,c.hi,c.mn,c.mx);
  run++;idx=0;right=0;log=[];startT=Date.now();
  show("quiz");next();
  clearInterval(timer);timer=setInterval(tick,100);tick();
 }

 function tick(){
  if(tmode&&!locked){var ql=perQ-(Date.now()-qStart)/1000;$("qtime").textContent=Math.max(0,Math.ceil(ql))+"s";$("qfill").style.transform="scaleX("+Math.max(0,ql/perQ)+")";$("qfill").classList.toggle("low",ql<=perQ*.3);if(ql<=0)timeoutQ()}
  var el=(Date.now()-startT)/1000;
  if(limit>0){
   var left=limit-el;
   $("clock").textContent="Time left "+fmt(left);
   var f=$("fill");f.style.transform="scaleX("+Math.max(0,left/limit)+")";
   f.classList.toggle("low",left<=limit*.2);
   if(left<=0)finish(true);
  }else{
   $("clock").textContent="Time "+fmt(el);
   $("fill").style.transform="scaleX("+(idx/total)+")";
  }
 }

 function next(){
  locked=false;qStart=Date.now();perQ=sched?Math.max(sched.to,sched.from-Math.floor(idx/5)):baseQ;
  $("q").textContent=qs[idx][0]+" × "+qs[idx][1];
  $("prog").textContent="Question "+(idx+1)+" of "+total;
  $("a").value="";$("a").className="ans";$("fb").textContent="";$("fb").className="fb";
  $("go").textContent="Check answer";$("go").classList.toggle("hidden",auto||padOn);$("padOk").style.visibility=auto?"hidden":"visible";$("qline").classList.toggle("hidden",!tmode);if(tmode){$("qfill").style.transform="scaleX(1)";$("qfill").classList.remove("low");$("qtime").textContent=perQ+"s"}
  $("a").focus();
 }

 function submit(){
  if(locked)return;
  var v=$("a").value;
  if(v==="")return;
  locked=true;
  held=v;var q=qs[idx],ans=q[0]*q[1],fb=$("fb");
  if(parseInt(v,10)===ans){right++;fb.textContent="\u2713 "+PRAISE[Math.floor(Math.random()*PRAISE.length)];fb.className="fb ok";$("a").className="ans ok"}
  else{fb.textContent="\u2715 Not quite. "+q[0]+" × "+q[1]+" = "+ans;fb.className="fb no";$("a").className="ans no"}
  var correct=parseInt(v,10)===ans;
  log.push({q:q,given:parseInt(v,10),ok:correct,secs:(Date.now()-qStart)/1000});
  var r=run;
  setTimeout(function(){
   if(r!==run)return;
   idx++;
   if(idx>=total)finish(false);else next();
  },correct?500:1600);
 }

 function finish(timeUp){
  run++;clearInterval(timer);
  var el=(Date.now()-startT)/1000;
  if(limit>0&&el>limit)el=limit;
  var un=0;
  if(timeUp){for(var i=idx+(locked?1:0);i<total;i++){un++;log.push({q:qs[i],given:null,ok:false,secs:null})}}
  var w=total-right;
  $("score").textContent=right+" / "+total;var pc=document.createElement("span");pc.className="pc";pc.textContent=" ("+Math.round(right/total*100)+"%)";$("score").appendChild(pc);

 function reconcile(r){
  var alias={},k;

  if(r.people&&r.people.alias)for(k in r.people.alias)alias[k]=r.people.alias[k];

  var all=P.list.concat(remoteList),best={};
